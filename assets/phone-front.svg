  <circle cx="249" cy="49" r="7.5" fill="url(#selfieLens)" stroke="#161d24" stroke-width="1"/>
  <circle cx="247" cy="47" r="2" fill="#7ec4ff" fill-opacity="0.55"/>
  <circle cx="172" cy="49" r="5" fill="#0e1318"/>
