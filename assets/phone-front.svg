<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" fill="none">
  <defs>
    <linearGradient id="frontTitanium" x1="0" y1="0" x2="420" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#697179"/>
      <stop offset="25%" stop-color="#2c3136"/>
      <stop offset="50%" stop-color="#1a1d20"/>
      <stop offset="78%" stop-color="#3e454c"/>
      <stop offset="100%" stop-color="#16191c"/>
    </linearGradient>
    <radialGradient id="selfieLens" cx="50%" cy="40%" r="55%">
