    d="M68 12 H352 A54 54 0 0 1 406 66 V794 A54 54 0 0 1 352 848 H68 A54 54 0 0 1 14 794 V66 A54 54 0 0 1 68 12 Z M70 22 H350 A46 46 0 0 1 396 68 V792 A46 46 0 0 1 350 838 H70 A46 46 0 0 1 24 792 V68 A46 46 0 0 1 70 22 Z"
