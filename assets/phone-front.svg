  <path fill-rule="evenodd" clip-rule="evenodd"
    d="M68 6 H352 A60 60 0 0 1 412 66 V794 A60 60 0 0 1 352 854 H68 A60 60 0 0 1 8 794 V66 A60 60 0 0 1 68 6 Z M70 22 H350 A46 46 0 0 1 396 68 V792 A46 46 0 0 1 350 838 H70 A46 46 0 0 1 24 792 V68 A46 46 0 0 1 70 22 Z"
