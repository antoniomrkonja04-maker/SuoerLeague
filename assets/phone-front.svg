  </defs>
  <!-- Hardware Side Buttons -->
  <rect x="4" y="156" width="4" height="36" rx="2" fill="#4f565d"/>
  <rect x="4" y="216" width="4" height="64" rx="2" fill="#4f565d"/>
  <rect x="4" y="294" width="4" height="64" rx="2" fill="#4f565d"/>
  <rect x="412" y="238" width="4" height="96" rx="2" fill="#4f565d"/>

